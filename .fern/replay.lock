    original_author: zach <zachary.greathouse@hume.ai>
    base_generation: 73f5e0fad7f4b3ae126079733acb127eab626da4
    files:
      - src/core/websocket/exports.ts
    patch_content: |
      diff --git a/src/core/websocket/exports.ts b/src/core/websocket/exports.ts
      index 9127165..fa40c89 100644
      --- a/src/core/websocket/exports.ts
      +++ b/src/core/websocket/exports.ts
      @@ -1,5 +1,5 @@
       import type * as events from "./events.js";
      -import type * as ws from "./ws.js";
      +import * as ws from "./ws.js";
       
       export type ReconnectingWebSocket = typeof ws.ReconnectingWebSocket;
       export declare namespace ReconnectingWebSocket {
      @@ -7,3 +7,9 @@ export declare namespace ReconnectingWebSocket {
           export type CloseEvent = events.CloseEvent;
           export type ErrorEvent = events.ErrorEvent;
       }
      +
      +/**
      + * The values of a realtime socket's `readyState`. Sending throws unless it is `OPEN`.
      + */
      +export type ReadyState = ws.ReconnectingWebSocket.ReadyState;
      +export const ReadyState: typeof ws.ReconnectingWebSocket.ReadyState = ws.ReconnectingWebSocket.ReadyState;
    theirs_snapshot:
      src/core/websocket/exports.ts: |
        import type * as events from "./events.js";
        import * as ws from "./ws.js";

        export type ReconnectingWebSocket = typeof ws.ReconnectingWebSocket;
        export declare namespace ReconnectingWebSocket {
            export type Event = events.Event;
            export type CloseEvent = events.CloseEvent;
            export type ErrorEvent = events.ErrorEvent;
        }

        /**
         * The values of a realtime socket's `readyState`. Sending throws unless it is `OPEN`.
         */
        export type ReadyState = ws.ReconnectingWebSocket.ReadyState;
        export const ReadyState: typeof ws.ReconnectingWebSocket.ReadyState = ws.ReconnectingWebSocket.ReadyState;
    user_owned: true
