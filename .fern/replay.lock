        import * as serializers from "../../../../serialization/index.js";
        import * as ExpressionMeasurement from "../../../index.js";
        import { VideoSocket } from "./Socket.js";

        export declare namespace VideoClient {
            export type Options = BaseClientOptions;

            export interface RequestOptions extends BaseRequestOptions {}

            export interface ConnectArgs {
                /** WebSocket subprotocols to use for the connection. */
                protocols?: string | string[];
                /** Additional query parameters to send with the websocket connect request. */
                queryParams?: Record<string, unknown>;
                /** Arbitrary headers to send with the websocket connect request. */
                headers?: Record<string, string>;
                /** Enable debug mode on the websocket. Defaults to false. */
                debug?: boolean;
                /** Maximum number of times to automatically reconnect after the connection closes unexpectedly. Defaults to 30. Set to 0 to disable reconnecting. */
                reconnectAttempts?: number;
                /** The timeout for establishing the WebSocket connection in seconds. */
                connectionTimeoutInSeconds?: number;
                /** A signal to abort the WebSocket connection. */
                abortSignal?: AbortSignal;
                /** Decides whether a server close event should trigger a reconnect. Not consulted for connection errors, timeouts, or internal closes. Return false to treat the close as terminal. A close after `session.close` was sent never reconnects. Defaults to reconnecting after a `session.closed` with reason `server_shutdown`, and after close codes 1001, 1006, 1011, 1012 and 1013. */
                shouldReconnect?: (event: core.CloseEvent) => boolean;
            }
        }

        /**
         * Measure expression in JPEG images.
         */
        export class VideoClient {
            protected readonly _options: NormalizedClientOptionsWithAuth<VideoClient.Options>;

            constructor(options: VideoClient.Options = {}) {
                this._options = normalizeClientOptionsWithAuth(options);
            }

            /**
             * Send one or more images, each as a `file` part, and, to change the defaults, settings as a JSON `config` part. The response holds one result per image, in the order the parts were sent. An image with no faces is a normal result with an empty `faces` array.
             *
             * ## Detection and measurement
             *
             * The server detects the faces in each image and lists them in `faces`. It measures the largest of them, up to the limit below, and lists those first, largest first.
             *
             * - A face is skipped, and is not listed, if its detection confidence is below `face.threshold` or its bounding box is under `face.min_size` pixels on its shorter side.
             * - Each measured face carries its bounding box, its detection confidence, a `face_id`, and two sets of scores: `expressions` for emotional expressions such as amusement or interest, and `descriptions` for visible facial actions such as a smile or a jaw drop.
             * - The faces that were not measured follow, most confident first, up to 32 faces in all. Each carries its bounding box and detection confidence, with `face_id`, `expressions` and `descriptions` null.
             * - `face_id` tracks a face across the images of one request. A face normally keeps its ID while it is measured, and can get it back after it leaves the view or is no longer among the largest faces. IDs do not identify a person.
             * - **Across requests:** IDs start again from 0 in every request. To keep them consistent, set `return_face_state` and pass the returned `face_state` as `face_state` in the next request.
             *
             * ## Limits
             *
             * | Limit | Value |
             * |---|---|
             * | Request size | 25MB, the whole multipart body |
             * | Image size | 2MB |
             * | Pixels per image | 8,294,400 (the area of a 3840x2160 image) |
             * | Faces measured per image | 2 by default, the largest; contact support to raise it |
             * | Faces listed per image | 32 |
             *
             * Every image is checked before any is measured. One bad image fails the whole request, which then returns no results:
             *
             * - **Not a JPEG:** rejected with `unsupported_media_type`.
             * - **Over the image size or pixel limit:** rejected with `image_too_large`.
             * - **Cannot be decoded:** rejected with `image_decode_failed`, possibly after earlier images were measured.
             *
             * @param {ExpressionMeasurement.VideoFileUpload} request
             * @param {VideoClient.RequestOptions} requestOptions - Request-specific configuration.
             *
             * @throws {@link ExpressionMeasurement.BadRequestError}
             * @throws {@link ExpressionMeasurement.UnauthorizedError}
             * @throws {@link ExpressionMeasurement.ForbiddenError}
             * @throws {@link ExpressionMeasurement.MethodNotAllowedError}
             * @throws {@link ExpressionMeasurement.ContentTooLargeError}
             * @throws {@link ExpressionMeasurement.UnsupportedMediaTypeError}
             * @throws {@link ExpressionMeasurement.InternalServerError}
             * @throws {@link ExpressionMeasurement.ServiceUnavailableError}
             * @throws {@link errors.ExpressionMeasurementError}
             * @throws {@link errors.ExpressionMeasurementTimeoutError}
             *
             * @example
             *     import { createReadStream } from "fs";
             *     await client.video.measure({
             *         file: [fs.createReadStream("/path/to/your/file")]
             *     })
             */
            public measure(
                request: ExpressionMeasurement.VideoFileUpload,
                requestOptions?: VideoClient.RequestOptions,
            ): core.HttpResponsePromise<ExpressionMeasurement.VideoFileResponse> {
                return core.HttpResponsePromise.fromPromise(this.__measure(request, requestOptions));
            }

            private async __measure(
                request: ExpressionMeasurement.VideoFileUpload,
                requestOptions?: VideoClient.RequestOptions,
            ): Promise<core.WithRawResponse<ExpressionMeasurement.VideoFileResponse>> {
                const _body = await core.newFormData();
                if (request.config != null) {
                    _body.append("config", toJson(request.config));
                }

                for (const _file of request.file) {
                    await _body.appendFile("file", _file);
                }

                const _maybeEncodedRequest = await _body.getRequest();
                const _authRequest: core.AuthRequest = await this._options.authProvider.getAuthRequest();
                const _headers: core.Fetcher.Args["headers"] = mergeHeaders(
                    _authRequest.headers,
                    this._options?.headers,
                    mergeOnlyDefinedHeaders({ ..._maybeEncodedRequest.headers }),
                    requestOptions?.headers,
                );
                const _response = await core.fetcher({
                    url: core.url.join(
                        (await core.Supplier.get(this._options.baseUrl)) ??
                            (
                                (await core.Supplier.get(this._options.environment)) ??
                                environments.ExpressionMeasurementEnvironment.Production
                            ).base,
                        "v1/expression/video/file",
                    ),
                    method: "POST",
                    headers: _headers,
                    queryString: core.url.queryBuilder().mergeAdditional(requestOptions?.queryParams).build(),
                    requestType: "file",
                    duplex: _maybeEncodedRequest.duplex,
                    body: _maybeEncodedRequest.body,
                    timeoutMs: (requestOptions?.timeoutInSeconds ?? this._options?.timeoutInSeconds ?? 60) * 1000,
                    maxRetries: requestOptions?.maxRetries ?? this._options?.maxRetries,
                    abortSignal: requestOptions?.abortSignal,
                    fetchFn: this._options?.fetch,
                    logging: this._options.logging,
                });
                if (_response.ok) {
                    return {
                        data: serializers.VideoFileResponse.parseOrThrow(_response.body, {
                            unrecognizedObjectKeys: "passthrough",
                            allowUnrecognizedUnionMembers: true,
                            allowUnrecognizedEnumValues: true,
                            skipValidation: true,
                            breadcrumbsPrefix: ["response"],
                        }),
                        rawResponse: _response.rawResponse,
                    };
                }

                if (_response.error.reason === "status-code") {
                    switch (_response.error.statusCode) {
                        case 400:
                            throw new ExpressionMeasurement.BadRequestError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 401:
                            throw new ExpressionMeasurement.UnauthorizedError(
                                serializers.AuthenticationError.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 403:
                            throw new ExpressionMeasurement.ForbiddenError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 405:
                            throw new ExpressionMeasurement.MethodNotAllowedError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 413:
                            throw new ExpressionMeasurement.ContentTooLargeError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 415:
                            throw new ExpressionMeasurement.UnsupportedMediaTypeError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 500:
                            throw new ExpressionMeasurement.InternalServerError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        case 503:
                            throw new ExpressionMeasurement.ServiceUnavailableError(
                                serializers.ErrorBody.parseOrThrow(_response.error.body, {
                                    unrecognizedObjectKeys: "passthrough",
                                    allowUnrecognizedUnionMembers: true,
                                    allowUnrecognizedEnumValues: true,
                                    skipValidation: true,
                                    breadcrumbsPrefix: ["response"],
                                }),
                                _response.rawResponse,
                            );
                        default:
                            throw new errors.ExpressionMeasurementError({
                                statusCode: _response.error.statusCode,
                                body: _response.error.body,
                                rawResponse: _response.rawResponse,
                            });
                    }
                }

                return handleNonStatusCodeError(_response.error, _response.rawResponse, "POST", "/v1/expression/video/file");
            }

            public async connect(args: VideoClient.ConnectArgs = {}): Promise<VideoSocket> {
                const {
                    protocols,
                    queryParams,
                    headers,
                    debug,
                    reconnectAttempts,
                    connectionTimeoutInSeconds,
                    abortSignal,
                    shouldReconnect,
                } = args;
                const _authRequest: core.AuthRequest = await this._options.authProvider.getAuthRequest();
                const _headers: Record<string, unknown> = mergeHeaders(_authRequest.headers, this._options?.headers, headers);
                const socket = new RealtimeWebSocket("video", {
                    url: core.url.join(
                        (await core.Supplier.get(this._options.baseUrl)) ??
                            (
                                (await core.Supplier.get(this._options.environment)) ??
                                environments.ExpressionMeasurementEnvironment.Production
                            ).production,
                        "/v1/expression/video/realtime",
                    ),
                    protocols: protocols ?? [],
                    queryParameters: queryParams ?? {},
                    headers: _headers,
                    options: {
                        debug: debug ?? false,
                        maxRetries: reconnectAttempts ?? 30,
                        connectionTimeout: connectionTimeoutInSeconds != null ? connectionTimeoutInSeconds * 1000 : undefined,
                        shouldReconnect,
                    },
                    abortSignal: abortSignal,
                });
                return new VideoSocket({ socket });
            }
        }
    user_owned: true
