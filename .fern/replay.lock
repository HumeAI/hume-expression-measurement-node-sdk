        // Maintained by hand and listed in .fernignore, so SDK regeneration leaves it in place.

        // Each test loads the audio helpers anew, so each sees decibri installed or broken its own way.

        async function openMicrophone(): Promise<unknown> {
            const { Microphone } = await import("../../src/audio-helpers/index");
            return Microphone.open();
        }

        describe("Microphone without a working decibri", () => {
            beforeEach(() => {
                vi.resetModules();
            });

            afterEach(() => {
                delete (globalThis as { decibriLoadError?: Error }).decibriLoadError;
                vi.doUnmock("decibri");
            });

            function failToLoad(error: Error): void {
                (globalThis as { decibriLoadError?: Error }).decibriLoadError = error;
                vi.doMock("decibri");
            }

            it("names the install command when decibri is not installed", async () => {
                failToLoad(Object.assign(new Error("Cannot find module 'decibri'"), { code: "MODULE_NOT_FOUND" }));

                await expect(openMicrophone()).rejects.toMatchObject({
                    name: "MissingDependencyError",
                    message: expect.stringContaining("npm install decibri"),
                });
            });

            it("names the system library when decibri's native addon cannot load", async () => {
                failToLoad(new Error("Cannot find native binding. npm has a bug related to optional dependencies"));

                await expect(openMicrophone()).rejects.toMatchObject({
                    name: "MissingDependencyError",
                    message: expect.stringContaining("sudo apt-get install libasound2t64"),
                });
            });

            it("throws decibri's own error when it fails to load for another reason", async () => {
                const failure = new Error("Native binding package version mismatch, expected 5.7.0 but got 5.6.0.");
                failToLoad(failure);

                await expect(openMicrophone()).rejects.toBe(failure);
            });
        });
      tests/audio-helpers/Microphone.test.ts: |
        // Maintained by hand and listed in .fernignore, so SDK regeneration leaves it in place.

        import { Microphone } from "../../src/audio-helpers/index";
        import { type FakeDevice, type FakeStream, fake } from "../__mocks__/decibri";

        vi.mock("decibri");

        function device(name: string, overrides: Partial<FakeDevice> = {}): FakeDevice {
            return {
                index: 0,
                name,
                id: `coreaudio:${name}`,
                maxInputChannels: 1,
                defaultSampleRate: 48000,
                isDefault: true,
                ...overrides,
            };
        }

        function tone(seconds = 1): Float32Array {
            return Float32Array.from(
                { length: Math.floor(48000 * seconds) },
                (_, i) => 0.5 * Math.sin((2 * Math.PI * 1000 * i) / 48000),
            );
        }

        function constant(value: number, samples = 160): Float32Array {
            return new Float32Array(samples).fill(value);
        }

        function pcm(value: number): Uint8Array {
            return new Uint8Array(new Int16Array(160).fill(Math.round(value * 32768)).buffer);
        }

        function stream(): FakeStream {
            return fake.streams[0];
        }

        function withTimeout<T>(promise: Promise<T>, ms = 1000): Promise<T> {
            return Promise.race([
                promise,
                new Promise<T>((_, reject) => setTimeout(() => reject(new Error(`Timed out after ${ms} ms`)), ms)),
            ]);
        }

        async function nextFrame(frames: AsyncIterator<Uint8Array>): Promise<Uint8Array> {
            const result = await withTimeout(frames.next());
            if (result.done) {
                throw new Error("The iteration ended.");
            }
            return result.value;
        }

        async function collect(microphone: Microphone): Promise<Uint8Array[]> {
            const frames: Uint8Array[] = [];
            for await (const frame of microphone) {
                frames.push(frame);
            }
            return frames;
        }

        function tick(): Promise<void> {
            return new Promise((resolve) => setImmediate(resolve));
        }

        function amplitudeAt(frequency: number, pcm: Uint8Array): number {
            const view = new DataView(pcm.buffer, pcm.byteOffset, pcm.length);
            let inPhase = 0;
            let quadrature = 0;
            const count = pcm.length / 2;
            for (let i = 0; i < count; i++) {
                const sample = view.getInt16(i * 2, true) / 32768;
                inPhase += sample * Math.cos((2 * Math.PI * frequency * i) / 16000);
                quadrature += sample * Math.sin((2 * Math.PI * frequency * i) / 16000);
            }
            return (2 * Math.hypot(inPhase, quadrature)) / count;
        }

        describe("Microphone", () => {
            let microphone: Microphone | undefined;

            beforeEach(() => {
                fake.reset([device("Built-in Microphone")]);
                microphone = undefined;
            });

            afterEach(async () => {
                fake.failOnStop = undefined;
                await microphone?.close();
            });

            async function open(options: Microphone.Options = {}): Promise<Microphone> {
                microphone = await Microphone.open(options);
                return microphone;
            }

            function at16k(): void {
                fake.reset([device("Built-in Microphone", { defaultSampleRate: 16000 })]);
            }

            it("yields 16 kHz frames of the recorded audio", async () => {
                const mic = await open({ frameMs: 100 });
                expect([mic.deviceName, mic.deviceSampleRate]).toEqual(["Built-in Microphone", 48000]);
                const frames = mic[Symbol.asyncIterator]();
                const audio = tone();
                for (let start = 0; start < audio.length; start += 480) {
                    stream().record(audio.subarray(start, start + 480));
                }
                const received: Uint8Array[] = [];
                for (let i = 0; i < 9; i++) {
                    received.push(await nextFrame(frames));
                }
                await mic.close();

                expect(received.map((frame) => frame.length)).toEqual(Array(9).fill(3200));
                expect(amplitudeAt(1000, Buffer.concat(received.slice(1)))).toBeCloseTo(0.5, 2);
                expect(stream().options).toEqual({
                    device: { id: "coreaudio:Built-in Microphone" },
                    sampleRate: 48000,
                    channels: 1,
                    dtype: "float32",
                    framesPerBuffer: 960,
                });
                expect(stream().stopped).toBe(true);
            });

            it("wakes a waiting iteration when audio arrives", async () => {
                at16k();
                const frames = (await open({ frameMs: 10 }))[Symbol.asyncIterator]();
                setTimeout(() => stream().record(constant(0.25)), 50);

                expect(await nextFrame(frames)).toEqual(pcm(0.25));
            });

            it("yields all recorded audio before iteration ends on close", async () => {
                const mic = await open({ frameMs: 100 });
                const collecting = collect(mic);
                await tick();
                const audio = tone(0.82);
                for (let start = 0; start < audio.length; start += 480) {
                    stream().record(audio.subarray(start, start + 480));
                }
                await mic.close();
                const frames = await withTimeout(collecting);

                expect(frames.every((frame) => frame.length > 0)).toBe(true);
                expect(Math.abs(frames.reduce((total, frame) => total + frame.length, 0) - 0.82 * 32000)).toBeLessThanOrEqual(
                    2,
                );
            });

            it("yields only audio recorded after an iteration starts", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                stream().record(constant(0.25));
                setImmediate(() => stream().record(constant(0.5)));
                const first = await nextFrame(mic[Symbol.asyncIterator]());
                stream().record(constant(0.75));
                setImmediate(() => stream().record(constant(-0.5)));
                const second = await nextFrame(mic[Symbol.asyncIterator]());

                expect([first, second]).toEqual([pcm(0.5), pcm(-0.5)]);
            });

            it("yields no audio held back by an earlier iteration", async () => {
                // The resampler holds back audio only when it converts the sample rate, so the device records at 48 kHz.
                const mic = await open({ frameMs: 10 });
                const record100Ms = (value: number) => {
                    for (let i = 0; i < 10; i++) {
                        stream().record(constant(value, 480));
                    }
                };
                setImmediate(() => record100Ms(0.5));
                await nextFrame(mic[Symbol.asyncIterator]());
                setImmediate(() => record100Ms(0));

                expect(await nextFrame(mic[Symbol.asyncIterator]())).toEqual(pcm(0));
            });

            it("ends an earlier iteration when a new one starts", async () => {
                const mic = await open();
                const older = collect(mic);
                await tick();
                mic[Symbol.asyncIterator]();

                expect(await withTimeout(older)).toEqual([]);
            });

            it("ends a replaced iteration without yielding its waiting audio", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                const older = mic[Symbol.asyncIterator]();
                // A 30 ms block converts to three frames, so two are still unread when the new iteration starts.
                stream().record(constant(0.25, 480));
                stream().record(constant(0.25));
                expect(await nextFrame(older)).toEqual(pcm(0.25));
                mic[Symbol.asyncIterator]();

                expect(await withTimeout(older.next())).toEqual({ done: true, value: undefined });
            });

            it("ends a waiting read when its iteration is returned", async () => {
                at16k();
                const frames = (await open({ frameMs: 10 }))[Symbol.asyncIterator]();
                const waiting = frames.next();
                await frames.return?.();
                stream().record(constant(0.25));

                expect(await withTimeout(waiting)).toEqual({ done: true, value: undefined });
            });

            it("rejects a second read while one is waiting", async () => {
                at16k();
                const frames = (await open({ frameMs: 10 }))[Symbol.asyncIterator]();
                const waiting = frames.next();

                await expect(frames.next()).rejects.toThrow(
                    "Another caller is already waiting for a frame from Built-in Microphone",
                );
                stream().record(constant(0.25));
                expect((await withTimeout(waiting)).value).toEqual(pcm(0.25));
            });

            it("ends iteration when the microphone closes", async () => {
                const mic = await open();
                const collecting = collect(mic);
                await tick();
                await mic.close();

                expect(await withTimeout(collecting)).toEqual([]);
                expect(await withTimeout(collect(mic))).toEqual([]);
            });

            it("ends iteration and releases the recording when stopping fails", async () => {
                const mic = await open();
                const collecting = collect(mic);
                await tick();
                fake.failOnStop = new Error("Failed to stop");

                await expect(mic.close()).rejects.toThrow("Failed to stop");
                expect(await withTimeout(collecting)).toEqual([]);
                expect(stream().destroyed).toBe(true);
            });

            it("does not count audio left behind by ended iterations toward the cap", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                const recordOneSecond = () => {
                    for (let i = 0; i < 100; i++) {
                        stream().record(constant(0.25));
                    }
                };
                // Each iteration leaves 0.99 seconds unread, so 20 of them would exceed the cap if kept.
                for (let i = 0; i < 20; i++) {
                    setImmediate(recordOneSecond);
                    expect(await nextFrame(mic[Symbol.asyncIterator]())).toEqual(pcm(0.25));
                }
            });

            it("throws when the stream stops on its own", async () => {
                const mic = await open();
                setImmediate(() => stream().fail(new Error("decibri: audio device error: The device is no longer available")));

                await expect(withTimeout(collect(mic))).rejects.toThrow(
                    "The audio stream from Built-in Microphone stopped, for example because the device was disconnected. " +
                        "decibri reported: decibri: audio device error: The device is no longer available",
                );
            });

            it("throws when the stream stops on its own even if the microphone is closed afterward", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                const frames = mic[Symbol.asyncIterator]();
                stream().record(constant(0.25));
                stream().fail(new Error("decibri: audio device error: The device is no longer available"));
                await mic.close();

                expect(await nextFrame(frames)).toEqual(pcm(0.25));
                await expect(withTimeout(frames.next())).rejects.toThrow(
                    "The audio stream from Built-in Microphone stopped, for example because the device was disconnected.",
                );
            });

            it("throws when more than 10 seconds of audio builds up", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                const frames = mic[Symbol.asyncIterator]();
                // Exactly 10 seconds, which is within the cap: a 30 ms block that converts to three frames,
                // then 997 blocks of 10 ms.
                stream().record(constant(0.25, 480));
                for (let i = 0; i < 997; i++) {
                    stream().record(constant(0.25));
                }
                expect(await nextFrame(frames)).toEqual(pcm(0.25));
                for (let i = 0; i < 10; i++) {
                    stream().record(constant(0.25));
                }

                // Thrown even though two frames of the 30 ms block are still unread.
                await expect(frames.next()).rejects.toThrow("More than 10 seconds of audio from Built-in Microphone");
                expect(await frames.next()).toEqual({ done: true, value: undefined });
                stream().record(constant(0.5));
                setImmediate(() => stream().record(constant(-0.5)));
                expect(await nextFrame(mic[Symbol.asyncIterator]())).toEqual(pcm(-0.5));
            });

            it("throws when frames shorter than blocks let the loop fall behind", async () => {
                at16k();
                const frames = (await open({ frameMs: 10 }))[Symbol.asyncIterator]();

                // Each 100 ms block converts to ten frames and the loop reads one frame per block, so it
                // falls another 90 ms behind with every block.
                await expect(
                    (async () => {
                        for (let i = 0; i < 200; i++) {
                            stream().record(constant(0.25, 1600));
                            await nextFrame(frames);
                        }
                    })(),
                ).rejects.toThrow("More than 10 seconds of audio");
            });

            it("counts audio decibri discarded without ending the iteration", async () => {
                at16k();
                const mic = await open({ frameMs: 10 });
                const frames = mic[Symbol.asyncIterator]();
                stream().record(constant(0.25));
                stream().overrunCount = 1;
                stream().record(constant(0.5));

                expect([await nextFrame(frames), await nextFrame(frames)]).toEqual([pcm(0.25), pcm(0.5)]);
                expect(mic.inputOverflows).toBe(1);
                await mic.close();
                expect(mic.inputOverflows).toBe(1);
            });

            it("counts audio decibri discarded after the last block it delivered", async () => {
                const mic = await open();
                stream().record(constant(0.25));
                stream().overrunCount = 2;
                await mic.close();

                expect(mic.inputOverflows).toBe(2);
            });

            it("keeps the count of discarded audio after the device fails", async () => {
                const mic = await open();
                stream().overrunCount = 3;
                stream().record(constant(0.25));
                stream().fail(new Error("decibri: audio device error: The device is no longer available"));

                expect(mic.inputOverflows).toBe(3);
            });

            it.each([
                [5, "There is no input device with index 5"],
                ["Studio", 'No input device matches "Studio"'],
                ["microphone", '"microphone" matches more than one input device'],
                [undefined, "There is no default input device"],
            ])("lists the input devices when %s cannot be used", async (selected, reason) => {
                fake.reset([
                    device("Built-in Microphone", { isDefault: false }),
                    device("USB Microphone", { index: 1, isDefault: false }),
                ]);

                await expect(Microphone.open({ device: selected })).rejects.toThrow(
                    `${reason}. Available input devices: 0: Built-in Microphone; 1: USB Microphone.`,
                );
                expect(fake.streams).toEqual([]);
            });

            it("says so when there are no input devices", async () => {
                fake.reset([]);

                await expect(Microphone.open()).rejects.toThrow(
                    "There is no default input device. No input devices are available.",
                );
            });

            it("selects a device whose whole name matches even if other names contain it", async () => {
                fake.reset([device("Microphone"), device("USB Microphone", { index: 1, isDefault: false })]);

                expect((await open({ device: "microphone" })).deviceName).toBe("Microphone");
                expect(stream().options.device).toEqual({ id: "coreaudio:Microphone" });
            });

            it("selects a device without a stable ID by index", async () => {
                fake.reset([device("Built-in Microphone"), device("USB Microphone", { index: 1, id: "", isDefault: false })]);

                expect((await open({ device: "usb" })).deviceName).toBe("USB Microphone");
                expect(stream().options.device).toBe(1);
            });

            it("rejects with decibri's error when the device fails to start", async () => {
                const failure = new Error("Failed to open audio stream: the device is busy");
                fake.failOnStart = failure;

                await expect(Microphone.open()).rejects.toBe(failure);
                expect(stream().destroyed).toBe(true);
            });

            it.each([0, 10001])("rejects a frame duration of %i before opening the device", async (frameMs) => {
                await expect(Microphone.open({ frameMs })).rejects.toThrow("frameMs must be between 1 and 10000");
                expect(fake.streams).toEqual([]);
            });

            it("points to open when constructed directly", () => {
                expect(() => Reflect.construct(Microphone, [])).toThrow("await Microphone.open()");
            });
        });
      tests/audio-helpers/Resampler.test.ts: |
        // Maintained by hand and listed in .fernignore, so SDK regeneration leaves it in place.

        import { Resampler } from "../../src/audio-helpers/index";

        function tone(frequency: number, sampleRate: number, seconds = 1, amplitude = 0.5): Float32Array {
            const samples = new Float32Array(Math.floor(sampleRate * seconds));
            for (let i = 0; i < samples.length; i++) {
                samples[i] = amplitude * Math.sin((2 * Math.PI * frequency * i) / sampleRate);
            }
            return samples;
        }

        function concat(...parts: Uint8Array[]): Uint8Array {
            const joined = new Uint8Array(parts.reduce((total, part) => total + part.length, 0));
            let offset = 0;
            for (const part of parts) {
                joined.set(part, offset);
                offset += part.length;
            }
            return joined;
        }

        function toSamples(pcm: Uint8Array): number[] {
            const view = new DataView(pcm.buffer, pcm.byteOffset, pcm.length);
            return Array.from({ length: pcm.length / 2 }, (_, i) => view.getInt16(i * 2, true));
        }

        function convert(resampler: Resampler, audio: Parameters<Resampler["process"]>[0]): number[] {
            return toSamples(concat(resampler.process(audio), resampler.flush()));
        }

        function middle(samples: number[]): number[] {
            const cut = Math.floor(samples.length / 10);
            return samples.slice(cut, samples.length - cut).map((sample) => sample / 32768);
        }

        function rms(samples: number[]): number {
            return Math.sqrt(samples.reduce((total, sample) => total + sample * sample, 0) / samples.length);
        }

        function amplitudeAt(frequency: number, samples: number[]): number {
            let inPhase = 0;
            let quadrature = 0;
            samples.forEach((sample, i) => {
                inPhase += sample * Math.cos((2 * Math.PI * frequency * i) / 16000);
                quadrature += sample * Math.sin((2 * Math.PI * frequency * i) / 16000);
            });
            return (2 * Math.hypot(inPhase, quadrature)) / samples.length;
        }

        function seededNoise(length: number, seed: number): Float32Array {
            let state = seed;
            const samples = new Float32Array(length);
            for (let i = 0; i < length; i++) {
                state = (state + 0x6d2b79f5) | 0;
                let t = Math.imul(state ^ (state >>> 15), 1 | state);
                t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
                samples[i] = ((t ^ (t >>> 14)) >>> 0) / 4294967296 - 0.5;
            }
            return samples;
        }

        describe("Resampler", () => {
            it.each([8000, 11025, 44100, 48000])("keeps the frequency, level and duration of a tone at %i Hz", (sampleRate) => {
                const out = convert(
                    new Resampler({ sampleRate, channels: 1, sampleFormat: "float32" }),
                    tone(1000, sampleRate),
                );

                expect(Math.abs(out.length - 16000)).toBeLessThanOrEqual(1);
                expect(amplitudeAt(1000, middle(out))).toBeCloseTo(0.5, 2);
                expect(rms(middle(out)) / (0.5 / Math.SQRT2)).toBeCloseTo(1, 2);
            });

            it("removes a tone above the output Nyquist frequency", () => {
                const out = convert(
                    new Resampler({ sampleRate: 48000, channels: 1, sampleFormat: "float32" }),
                    tone(10000, 48000),
                );

                expect(rms(middle(out))).toBeLessThan(1e-3);
            });

            // At 1 MHz the kernel reaches 4000 input samples either side, so an output spans several blocks.
            it.each([
                1000, 48000, 1000000,
            ])("converts a stream split into blocks to the same bytes as the whole stream at %i Hz", (sampleRate) => {
                const audio = seededNoise(sampleRate / 10, 0);
                const whole = new Resampler({ sampleRate, channels: 1, sampleFormat: "float32" });
                const split = new Resampler({ sampleRate, channels: 1, sampleFormat: "float32" });
                const third = Math.floor(audio.length / 3);

                const expected = concat(whole.process(audio), whole.flush());
                const actual = concat(
                    ...[0, 1, 2, third, third + 1, 2 * third].map((start, i, starts) =>
                        split.process(audio.subarray(start, starts[i + 1])),
                    ),
                    split.flush(),
                );

                expect(actual).toEqual(expected);
            });

            it("holds back 64 samples at the lower of the input rate and 16 kHz", () => {
                const heldBack = (sampleRate: number) => {
                    const resampler = new Resampler({ sampleRate, channels: 1, sampleFormat: "float32" });
                    return 1600 - resampler.process(tone(100, sampleRate, 0.1)).length / 2;
                };

                expect(heldBack(1000)).toBe(1024);
                expect(heldBack(8000)).toBe(128);
                expect(heldBack(48000)).toBe(64);
            });

            it("passes 16 kHz mono int16 through unchanged", () => {
                const pcm = Uint8Array.from(seededNoise(3200, 1), (sample) => Math.floor((sample + 0.5) * 256));
                const resampler = new Resampler({ sampleRate: 16000, channels: 1 });

                expect(concat(resampler.process(pcm), resampler.flush())).toEqual(pcm);
            });

            it("averages channels and accepts bytes that split a frame", () => {
                const stereo = new Uint8Array(new Int16Array([1000, 3000, -32768, -32768, 101, 100]).buffer);
                const resampler = new Resampler({ sampleRate: 16000, channels: 2 });

                const pcm = concat(
                    resampler.process(stereo.subarray(0, 3)),
                    resampler.process(stereo.subarray(3)),
                    resampler.flush(),
                );

                expect(toSamples(pcm)).toEqual([2000, -32768, 100]);
            });

            it("converts float64 arrays and float32 bytes like float32 arrays", () => {
                const left = tone(1000, 44100);
                const right = tone(300, 44100);
                const stereo = new Float32Array(left.length * 2);
                left.forEach((sample, i) => {
                    stereo[i * 2] = sample;
                    stereo[i * 2 + 1] = right[i];
                });
                const expected = convert(new Resampler({ sampleRate: 44100, channels: 2, sampleFormat: "float32" }), stereo);

                const float64 = convert(
                    new Resampler({ sampleRate: 44100, channels: 2, sampleFormat: "float64" }),
                    Float64Array.from(stereo),
                );
                const bytes = convert(
                    new Resampler({ sampleRate: 44100, channels: 2, sampleFormat: "float32" }),
                    new Uint8Array(stereo.buffer),
                );

                expect(float64).toEqual(expected);
                expect(bytes).toEqual(expected);
            });

            it("clips float input beyond full scale", () => {
                const resampler = new Resampler({ sampleRate: 16000, channels: 1, sampleFormat: "float32" });

                expect(convert(resampler, new Float32Array([1.5, -1.5, 0.25]))).toEqual([32767, -32768, 8192]);
            });

            it("rejects a stream that ends partway through a frame at flush and resets", () => {
                const resampler = new Resampler({ sampleRate: 16000, channels: 2 });
                resampler.process(new Uint8Array([1, 2, 3]));

                expect(() => resampler.flush()).toThrow("3 bytes into a sample frame of 4 bytes");
                expect(concat(resampler.process(new Uint8Array(4)), resampler.flush())).toEqual(new Uint8Array(2));
            });

            it("takes a new stream after flush", () => {
                const resampler = new Resampler({ sampleRate: 48000, channels: 1, sampleFormat: "float32" });
                const first = convert(resampler, tone(1000, 48000));

                expect(convert(resampler, tone(1000, 48000))).toEqual(first);
            });

            it("takes a new stream after a flush that throws", () => {
                const resampler = new Resampler({ sampleRate: 48000, channels: 1, sampleFormat: "float32" });
                const audio = new Uint8Array(tone(1000, 48000).buffer);
                resampler.process(audio);
                resampler.process(new Uint8Array(1));

                expect(() => resampler.flush()).toThrow("1 bytes into a sample frame of 4 bytes");
                const expected = convert(new Resampler({ sampleRate: 48000, channels: 1, sampleFormat: "float32" }), audio);
                expect(convert(resampler, audio)).toEqual(expected);
            });

            it("rejects an array of the wrong type or holding a partial frame", () => {
                const resampler = new Resampler({ sampleRate: 16000, channels: 2 });

                expect(() => resampler.process(new Float32Array(8))).toThrow(TypeError);
                expect(() => resampler.process(new Float32Array(8))).toThrow("must be an Int16Array, got Float32Array");
                expect(() => resampler.process(new Int16Array(3))).toThrow("whole frames of 2 samples, got 3 samples");
            });

            it("accepts a sample rate that is not an integer", () => {
                const out = convert(
                    new Resampler({ sampleRate: 47999.5, channels: 1, sampleFormat: "float32" }),
                    tone(1000, 47999.5),
                );

                expect(Math.abs(out.length - 16000)).toBeLessThanOrEqual(1);
                expect(amplitudeAt(1000, middle(out))).toBeCloseTo(0.5, 2);
            });

            it.each([999, 2 ** 32, Number.NaN, Number.POSITIVE_INFINITY])("rejects a sample rate of %d", (sampleRate) => {
                expect(() => new Resampler({ sampleRate, channels: 1 })).toThrow(
                    "sampleRate must be between 1000 and 4294967295",
                );
            });

            it("rejects a sample rate that is not a number", () => {
                expect(() => new Resampler({ sampleRate: "48000" as unknown as number, channels: 1 })).toThrow(
                    'sampleRate must be a number, got "48000".',
                );
            });

            it("rejects a channel count that is not an integer", () => {
                expect(() => new Resampler({ sampleRate: 48000, channels: 2.5 })).toThrow(
                    "channels must be an integer, got 2.5.",
                );
            });
        });
      tests/audio-helpers/wav.test.ts: |
        // Maintained by hand and listed in .fernignore, so SDK regeneration leaves it in place.

        import { execFileSync } from "child_process";
        import { mkdtempSync, readFileSync, rmSync, writeFileSync } from "fs";
        import { writeFile } from "fs/promises";
        import { tmpdir } from "os";
        import { join } from "path";
        import { iterWavFrames } from "../../src/audio-helpers/index";

        interface WavOptions {
            tag: number;
            sampleRate: number;
            channels: number;
            bits: number;
            data: Uint8Array;
            extensible?: boolean;
            fmtExtra?: Uint8Array;
            dataSize?: number;
            afterData?: Uint8Array;
            blockAlign?: number;
            riffSize?: number;
            // An odd-sized chunk before the data exercises the padding byte that follows it.
            oddChunk?: boolean;
        }

        function uint32(value: number): Buffer {
            const bytes = Buffer.alloc(4);
            bytes.writeUInt32LE(value);
            return bytes;
        }

        function wavBytes({
            tag,
            sampleRate,
            channels,
            bits,
            data,
            extensible = false,
            fmtExtra = new Uint8Array(0),
            dataSize,
            afterData = new Uint8Array(0),
            blockAlign = channels * Math.ceil(bits / 8),
            riffSize,
            oddChunk = true,
        }: WavOptions): Buffer {
            const fields = Buffer.alloc(16);
            fields.writeUInt16LE(extensible ? 0xfffe : tag, 0);
            fields.writeUInt16LE(channels, 2);
            fields.writeUInt32LE(sampleRate, 4);
            // The reader ignores the byte rate, so an overflowing value is truncated to fit its field.
            fields.writeUInt32LE((sampleRate * blockAlign) % 2 ** 32, 8);
            fields.writeUInt16LE(blockAlign, 12);
            fields.writeUInt16LE(bits, 14);
            const parts: Uint8Array[] = [fields];
            if (extensible) {
                const extension = Buffer.alloc(24);
                extension.writeUInt16LE(22, 0);
                extension.writeUInt16LE(bits, 2);
                extension.writeUInt16LE(tag, 8);
                Buffer.from("000000001000800000aa00389b71", "hex").copy(extension, 10);
                parts.push(extension);
            }
            parts.push(fmtExtra);
            const fmt = Buffer.concat(parts);
            const info = Buffer.from("INFOISFT\x05\x00\x00\x00Lavf\x00", "latin1");
            const body = Buffer.concat([
                Buffer.from("WAVEfmt ", "latin1"),
                uint32(fmt.length),
                fmt,
                Buffer.alloc(fmt.length % 2),
                oddChunk
                    ? Buffer.concat([Buffer.from("LIST", "latin1"), uint32(info.length), info, Buffer.alloc(1)])
                    : Buffer.alloc(0),
                Buffer.from("data", "latin1"),
                uint32(dataSize ?? data.length),
                data,
                afterData,
            ]);
            return Buffer.concat([Buffer.from("RIFF", "latin1"), uint32(riffSize ?? body.length), body]);
        }

        // The header Python's wave module and most other writers produce: fmt and data chunks only.
        function basicWavBytes(sampleRate: number, channels: number, sampleWidth: number, data: Uint8Array): Buffer {
            return wavBytes({ tag: 1, sampleRate, channels, bits: sampleWidth * 8, data, oddChunk: false });
        }

        function int16Bytes(samples: number[]): Uint8Array {
            return new Uint8Array(new Int16Array(samples).buffer);
        }

        function range(start: number, end: number): number[] {
            return Array.from({ length: end - start }, (_, i) => start + i);
        }

        function seededBytes(length: number, seed: number): Uint8Array {
            let state = seed;
            return Uint8Array.from({ length }, () => {
                state = (Math.imul(state, 1103515245) + 12345) >>> 0;
                return state >>> 24;
            });
        }

        function toSamples(pcm: Uint8Array): number[] {
            const view = new DataView(pcm.buffer, pcm.byteOffset, pcm.length);
            return Array.from({ length: pcm.length / 2 }, (_, i) => view.getInt16(i * 2, true));
        }

        async function collect(frames: AsyncIterable<Uint8Array>): Promise<Uint8Array[]> {
            const collected: Uint8Array[] = [];
            for await (const frame of frames) {
                collected.push(frame);
            }
            return collected;
        }

        async function readAll(path: string, frameMs?: number): Promise<Uint8Array> {
            return Buffer.concat(await collect(iterWavFrames(path, { frameMs })));
        }

        describe("iterWavFrames", () => {
            let dir: string;

            beforeEach(() => {
                dir = mkdtempSync(join(tmpdir(), "wav-test-"));
            });

            afterEach(() => {
                rmSync(dir, { recursive: true, force: true });
            });

            function write(name: string, bytes: Uint8Array): string {
                const path = join(dir, name);
                writeFileSync(path, bytes);
                return path;
            }

            it("splits a 16 kHz mono 16-bit file into frames unchanged", async () => {
                const pcm = seededBytes(8000, 0);
                const path = write("speech.wav", basicWavBytes(16000, 1, 2, pcm));

                const frames = await collect(iterWavFrames(path));

                expect(frames.map((frame) => frame.length)).toEqual([3200, 3200, 1600]);
                expect(Buffer.concat(frames)).toEqual(Buffer.from(pcm));
            });

            it("converts a 48 kHz stereo 24-bit file to 16 kHz mono", async () => {
                const data = Buffer.alloc(48000 * 2 * 3);
                for (let i = 0; i < 48000; i++) {
                    const sample = Math.round(0.5 * Math.sin((2 * Math.PI * 440 * i) / 48000) * 2 ** 23);
                    data.writeIntLE(sample, i * 6, 3);
                    data.writeIntLE(sample, i * 6 + 3, 3);
                }
                const path = write("speech.wav", basicWavBytes(48000, 2, 3, data));

                const frames = await collect(iterWavFrames(path, { frameMs: 250 }));
                const out = toSamples(Buffer.concat(frames));

                expect(frames.slice(0, -1).every((frame) => frame.length === 8000)).toBe(true);
                expect(frames[frames.length - 1].length).toBeGreaterThan(0);
                expect(frames[frames.length - 1].length).toBeLessThanOrEqual(8000);
                expect(Math.abs(out.length - 16000)).toBeLessThanOrEqual(1);
                expect(Math.max(...out.map(Math.abs)) / (0.5 * 32768)).toBeCloseTo(1, 2);
            });

            it("reads 8-bit samples as unsigned", async () => {
                const path = write("speech.wav", basicWavBytes(16000, 1, 1, new Uint8Array([128, 255, 0])));

                expect(toSamples(await readAll(path))).toEqual([0, 32512, -32768]);
            });

            it("reads an extensible header like the basic header", async () => {
                const data = seededBytes(48000 * 2 * 3, 1);
                const basic = write("basic.wav", basicWavBytes(48000, 2, 3, data));
                const extensible = write(
                    "extensible.wav",
                    wavBytes({ tag: 1, sampleRate: 48000, channels: 2, bits: 24, data, extensible: true }),
                );

                expect(await collect(iterWavFrames(extensible))).toEqual(await collect(iterWavFrames(basic)));
            });

            it("skips bytes after the format fields", async () => {
                const data = int16Bytes(range(-800, 800));
                const path = write(
                    "long-fmt.wav",
                    wavBytes({
                        tag: 1,
                        sampleRate: 16000,
                        channels: 1,
                        bits: 16,
                        data,
                        extensible: true,
                        fmtExtra: Uint8Array.from(range(0, 21)),
                    }),
                );

                expect(await readAll(path)).toEqual(Buffer.from(data));
            });

            it.each([
                [32, false],
                [64, true],
            ])("converts %i-bit floating point samples, extensible %s", async (bits, extensible) => {
                const values = [0, 0.25, -0.5, 1.5];
                const samples = bits === 32 ? new Float32Array(values) : new Float64Array(values);
                const path = write(
                    "float.wav",
                    wavBytes({
                        tag: 3,
                        sampleRate: 16000,
                        channels: 1,
                        bits,
                        data: new Uint8Array(samples.buffer),
                        extensible,
                    }),
                );

                expect(toSamples(await readAll(path))).toEqual([0, 8192, -16384, 32767]);
            });

            it("does not read chunks after the data as audio", async () => {
                const pcm = int16Bytes(range(-800, 800));
                const id3 = Buffer.concat([Buffer.from("id3 ", "latin1"), uint32(64), Uint8Array.from(range(0, 64))]);
                const path = write(
                    "tagged.wav",
                    wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: pcm, afterData: id3 }),
                );

                expect(await readAll(path)).toEqual(Buffer.from(pcm));
            });

            it("reads data of unknown size to the end of the file", async () => {
                const pcm = int16Bytes(range(-800, 800));
                const path = write(
                    "piped.wav",
                    wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: pcm, dataSize: 0xffffffff }),
                );

                expect(await readAll(path)).toEqual(Buffer.from(pcm));
            });

            it("reads a recording that was never closed to the end of the file", async () => {
                const pcm = int16Bytes(range(-800, 800));
                // libsndfile writes a RIFF size of 8 and a data size of 0 when it opens a file, and the real sizes
                // when it closes it.
                const path = write(
                    "killed.wav",
                    wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: pcm, dataSize: 0, riffSize: 8 }),
                );

                expect(await readAll(path)).toEqual(Buffer.from(pcm));
            });

            it.each([
                undefined,
                0xffffffff,
            ])("gives no frames for an empty data chunk followed by metadata, RIFF size %s", async (riffSize) => {
                const id3 = Buffer.concat([Buffer.from("id3 ", "latin1"), uint32(64), Uint8Array.from(range(0, 64))]);
                const path = write(
                    "tagged.wav",
                    wavBytes({
                        tag: 1,
                        sampleRate: 16000,
                        channels: 1,
                        bits: 16,
                        data: new Uint8Array(0),
                        afterData: id3,
                        riffSize,
                    }),
                );

                expect(await collect(iterWavFrames(path))).toEqual([]);
            });

            it.skipIf(process.platform === "win32")("reads a WAV from a named pipe", async () => {
                const pcm = int16Bytes(range(-800, 800));
                const wav = wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: pcm, dataSize: 0xffffffff });
                const fifo = join(dir, "pipe");
                execFileSync("mkfifo", [fifo]);

                const writing = writeFile(fifo, wav);
                const out = await readAll(fifo);
                await writing;

                expect(out).toEqual(Buffer.from(pcm));
            });

            it("reads a file ending partway through a sample to the last whole sample", async () => {
                const pcm = int16Bytes([100, -200, 300]);
                const path = write("interrupted.wav", basicWavBytes(16000, 1, 2, pcm));
                writeFileSync(path, readFileSync(path).subarray(0, -1));

                expect(await readAll(path)).toEqual(Buffer.from(pcm.subarray(0, 4)));
            });

            it("reads 12-bit samples from the high bits of 16-bit containers", async () => {
                const data = int16Bytes([0, 1024, -2048, 2047].map((sample) => sample << 4));
                const path = write("12-bit.wav", wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 12, data }));

                expect(toSamples(await readAll(path))).toEqual([0, 16384, -32768, 32752]);
            });

            it("rejects a sample rate below 1 kHz with a conversion command", async () => {
                const path = write(
                    "crafted.wav",
                    wavBytes({ tag: 1, sampleRate: 999, channels: 1, bits: 16, data: new Uint8Array(100) }),
                );

                await expect(readAll(path)).rejects.toThrow(/999 Hz is below the minimum of 1000 Hz.*ffmpeg -i input.wav/);
            });

            it.each([0, 1])("ignores a block size left at %i", async (blockAlign) => {
                const pcm = int16Bytes(range(-800, 800));
                const path = write(
                    "speech.wav",
                    wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: pcm, blockAlign }),
                );

                expect(await readAll(path)).toEqual(Buffer.from(pcm));
            });

            it("rejects a block size larger than one sample per channel", async () => {
                const path = write(
                    "padded.wav",
                    wavBytes({ tag: 1, sampleRate: 16000, channels: 2, bits: 24, data: new Uint8Array(64), blockAlign: 8 }),
                );

                await expect(readAll(path)).rejects.toThrow("the fmt chunk is inconsistent");
            });

            it("rejects a floating point depth other than 32 or 64 bits", async () => {
                const path = write(
                    "float.wav",
                    wavBytes({ tag: 3, sampleRate: 16000, channels: 1, bits: 31, data: new Uint8Array(16) }),
                );

                await expect(readAll(path)).rejects.toThrow("31-bit floating point");
            });

            it("reads a header declaring an enormous sample rate in bounded pieces", async () => {
                // Reading 100 ms at this rate and channel count at once would need an allocation of hundreds of
                // gigabytes, which fails.
                const path = write(
                    "crafted.wav",
                    wavBytes({
                        tag: 1,
                        sampleRate: 0xffffffff,
                        channels: 32767,
                        bits: 16,
                        data: new Uint8Array(32767 * 2 * 4),
                        dataSize: 0xffffffff,
                    }),
                );

                expect(await collect(iterWavFrames(path))).toEqual([]);
            });

            it("rejects a compressed WAV with a conversion command", async () => {
                const path = write(
                    "adpcm.wav",
                    wavBytes({ tag: 2, sampleRate: 16000, channels: 1, bits: 4, data: new Uint8Array(100) }),
                );

                await expect(readAll(path)).rejects.toThrow(
                    /format tag 0x0002.*ffmpeg -i input.wav -ac 1 -ar 16000 -sample_fmt s16/,
                );
            });

            it("rejects an RF64 file with a conversion command", async () => {
                const wav = wavBytes({ tag: 1, sampleRate: 16000, channels: 1, bits: 16, data: new Uint8Array(100) });
                wav.write("RF64", 0, "latin1");
                const path = write("long.wav", wav);

                await expect(readAll(path)).rejects.toThrow(
                    /RF64 files are not supported.*ffmpeg -i input.wav -ac 1 -ar 16000 -sample_fmt s16/,
                );
            });

            it.each([0, 10001])("rejects a frame duration of %i at call time", (frameMs) => {
                expect(() => iterWavFrames(join(dir, "unused.wav"), { frameMs })).toThrow(
                    "frameMs must be between 1 and 10000",
                );
            });

            it("rejects a frame duration that is not an integer at call time", () => {
                expect(() => iterWavFrames(join(dir, "unused.wav"), { frameMs: 20.5 })).toThrow(
                    "frameMs must be an integer, got 20.5.",
                );
            });
        });
